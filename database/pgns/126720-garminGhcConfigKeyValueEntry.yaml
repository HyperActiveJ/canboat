- raw: "2023-01-01-00:00:00.000,7,126720,11,9,18,e5,98,fe,09,0b,0b,aa,31,4a,89,06,00,00,00,07,00,01,00"
  expects:
    subProtocolId: 2558
    configKey: 2303340970
