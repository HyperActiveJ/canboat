pgn: 130821
id: mercuryPopUpNotification
description: 'Mercury: Pop-up Notification'
type: Fast
variantOrder: 5
priority: 7
missing:
- Fields
- FieldLengths
- Resolution
- Lookups
- SampleData
explanation: 'Mercury display pop-up notification. A header (version + pop-up count) followed by a repeating set of pop-up records. Each pop-up record carries a nested variable-length button array (a per-record button count followed by that many button records) which the flat field model cannot represent; the repeating stride here is the scalar pop-up record only and is faithful for the zero-button case. The value labels (pop-up id, engine state, single-lever mode enumerations) are not enumerated here.'
