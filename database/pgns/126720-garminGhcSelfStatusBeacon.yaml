pgn: 126720
id: garminGhcSelfStatusBeacon
description: 'Garmin: GHC Self-Status Beacon'
type: Fast
variantOrder: 85
priority: 7
missing:
- Fields
- FieldLengths
- Resolution
explanation: 'Garmin GHC self-status beacon: the single-node counterpart of the node-status report. A fixed 8-byte header, the GHC''s own 32-bit node id, then a small sequence counter and a 2-byte status word. The status word''s value semantics are GHC-internal.'
fields:
- id: manufacturerCode
  name: Manufacturer Code
  type: LOOKUP
  bits: 11
  description: Garmin
  match: 229
  lookup: MANUFACTURER_CODE
- id: reserved
  name: Reserved
  type: RESERVED
  bits: 2
- id: industryCode
  name: Industry Code
  type: LOOKUP
  bits: 3
  description: Marine Industry
  match: 4
  lookup: INDUSTRY_CODE
- id: subProtocolId
  name: Sub-protocol ID
  type: LOOKUP
  bits: 16
  description: GHC self-status transport
  match: 6472
  lookup: GARMIN_MESSAGE_ID
  primaryKey: true
- id: wrapperByte1
  name: Wrapper Byte 1
  type: UINT8
  match: 2
- id: wrapperByte2
  name: Wrapper Byte 2
  type: UINT8
  match: 2
- id: messageId
  name: Message ID
  type: UINT16
  match: 771
- id: statusHeader
  name: Status Header
  type: BINARY
  bits: 64
  description: Constant report header 01 01 03 0F 08 FF 0F 00, same as the node-status report
- id: nodeId
  name: Node ID
  type: UINT32
  description: The emitting GHC's own node address (fixed)
- id: field20
  name: Field 20
  type: UINT8
  description: Constant 0x01
- id: sequence
  name: Sequence
  type: UINT8
  description: Small counter
- id: status
  name: Status
  type: UINT16
  description: A varying status word; GHC-internal semantics
