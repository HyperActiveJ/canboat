explanation: 'Garmin device-presence / master-advertise beacon, broadcast by Garmin nodes on the bus (Reactor autopilot, GHC, GPSMAP). The discriminator is the device role in Wrapper Byte 1 and the last body byte: 0x0A on the Reactor (autopilot), 0x00/0x01 on the displays and GHC. The body carries a constant protocol magic (0xD4909C97). A heartbeat/role advertisement with no event content.'
