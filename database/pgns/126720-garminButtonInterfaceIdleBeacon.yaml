explanation: 'Garmin keypad/button-interface (GRID) idle beacon carried in the Garmin 126720 proprietary container. The idle payload is a fixed 5-byte body (01 11 02 19 00); the keypress content, which appears only while a key is pressed, is not decoded here.'
