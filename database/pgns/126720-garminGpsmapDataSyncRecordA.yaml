pgn: 126720
id: garminGpsmapDataSyncRecordA
description: 'Garmin: GPSMAP Data-Sync Record A'
type: Fast
variantOrder: 87
priority: 7
missing:
- Fields
- FieldLengths
- Resolution
explanation: 'Garmin GPSMAP data-sync broadcast A: a fixed 23-byte data record. Unset fields use the NMEA not-available sentinels (0xFF for unsigned, 0x7FFF / 0x7FFFFFFF for signed), which expose the field grid. The per-field widths, scales and names are not decoded, so the body is left as binary.'
fields:
- id: manufacturerCode
  name: Manufacturer Code
  type: LOOKUP
  bits: 11
  description: Garmin
  match: 229
  lookup: MANUFACTURER_CODE
- id: reserved
  name: Reserved
  type: RESERVED
  bits: 2
- id: industryCode
  name: Industry Code
  type: LOOKUP
  bits: 3
  description: Marine Industry
  match: 4
  lookup: INDUSTRY_CODE
- id: subProtocolId
  name: Sub-protocol ID
  type: LOOKUP
  bits: 16
  description: GPSMAP data-sync transport A
  match: 1810
  lookup: GARMIN_MESSAGE_ID
  primaryKey: true
- id: wrapperByte1
  name: Wrapper Byte 1
  type: UINT8
  match: 2
- id: wrapperByte2
  name: Wrapper Byte 2
  type: UINT8
  match: 2
- id: data
  name: Data
  type: BINARY
  bits: 184
  description: 23-byte data record. Unset fields use the NMEA not-available sentinels (0xFF unsigned, 0x7FFF / 0x7FFFFFFF signed), which expose the field boundaries (signed-16 fields end at body bytes 24 and 28). The per-field widths, scales and names are not decoded
